name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Sintaxe do content script
        run: node --check src/content.js

      - name: Manifest válido e campos obrigatórios
        run: node scripts/validate-manifest.mjs

      - name: Testes de unidade (normalização)
        run: node --test
