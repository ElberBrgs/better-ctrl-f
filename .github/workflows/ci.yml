name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Sintaxe dos content scripts
        run: |
          node --check src/search-core.js
          node --check src/content.js

      - name: Manifest válido e campos obrigatórios
        run: node scripts/validate-manifest.mjs

      - name: Testes de unidade (normalização)
        run: node --test

      - name: Testes BDD (Gherkin)
        run: |
          npm ci
          npx cucumber-js
